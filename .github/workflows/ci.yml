name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

# Cancel superseded runs on the same ref (issue #16): docs-only or fixup
# pushes to a PR branch must not queue behind full test runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer || true

      # SwiftPM cache (issue #16). Keyed on Package.swift — this package has no
      # external dependencies (no Package.resolved), so the win is the module
      # cache and manifest parse, not dependency downloads.
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Swift version
        run: swift --version

      - name: Build (debug)
        run: swift build

      - name: Build (release)
        run: swift build -c release

      - name: Test
        run: swift test
        env:
          FUSION_EVENT_STRESS: ""
          FUSION_EVENT_E2E: ""

      - name: Verify test count
        run: |
          output=$(swift test 2>&1)
          echo "$output"
          echo "$output" | grep -c "Executed [0-9]* tests, with 0 failures" || {
            echo "test verification failed"
            exit 1
          }

      - name: start.sh registry self-check tests
        run: bash scripts/test-start-registry.sh

  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install swift-format
        run: brew install swift-format

      - name: Format check
        run: swift-format lint -r Sources Tests --configuration .swift-format
